spring:
  application:
    name: Nexora

  # Env injection is done by IntelliJ's EnvFile plugin (validation.io).
  # Spring Boot's PropertySourceLoader also natively supports .env style
  # files when referenced via spring.config.import below, so no Java
  # dotenv library is needed (avoids double-loading / conflicting sources).
  config:
    import:
      - optional:classpath:application-${spring.profiles.active}.yaml
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
      - optional:file:.env.local[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nexora}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:Ar0171##}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false

  flyway:
    enabled: false

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

  task:
    execution:
      pool:
        core-size: 5
        max-size: 20
        queue-capacity: 200

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-change-me-1234567890}
    access-token-expiry-ms: ${JWT_ACCESS_EXPIRY:3600000}        # 1h
    refresh-token-expiry-ms: ${JWT_REFRESH_EXPIRY:604800000}   # 7d
  super-admin:
    seed-email: ${SUPER_ADMIN_EMAIL:admin@nexora.bd}
    seed-password: ${SUPER_ADMIN_PASSWORD:Admin@12345}

logging:
  level:
    root: INFO
    com.shazan.Nexora: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: INFO

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized